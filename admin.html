<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZELQIO Orders</title>
<style>:root{--bg:#07070d;--card:#12121e;--bd:rgba(255,255,255,.1);--t:#f3f3fa;--m:#9a9ab5;--a:#7c5cff;--c:#00c2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:1.2rem;letter-spacing:.14em}.wrap{padding:18px 5vw 60px}
.btn{background:linear-gradient(110deg,var(--a),#ff3ec9);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}.ghost{background:transparent;border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}.st b{font-size:1.6rem;display:block}.st span{color:var(--m);font-size:.8rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.bar button{background:var(--card);border:1px solid var(--bd);color:var(--t);border-radius:999px;padding:7px 14px;cursor:pointer}.bar button.on{border-color:var(--a);background:rgba(124,92,255,.25)}
.o{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{font-size:.72rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1)}.paid{background:rgba(0,217,160,.2);color:#6ff5c8}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;margin:10px 0;color:var(--m);font-size:.9rem}.g b{color:var(--t);font-weight:600}
.ed{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--bd);padding-top:10px}input,select{background:#0b0b14;border:1px solid var(--bd);color:var(--t);border-radius:10px;padding:9px 10px;font:inherit}input{flex:1;min-width:140px}
#msg{color:var(--m);padding:30px 0;text-align:center}.err{color:#ff8a8a}</style></head><body>
<header><h1>ZELQIO · ORDERS</h1><div id="who"></div></header><div class="wrap"><div id="gbtn"></div><div id="msg">Sign in with the owner Google account to see orders.</div><div id="app" hidden><div class="stats" id="stats"></div><div class="bar" id="bar"></div><div id="list"></div></div></div>
<script src="config.js"></script><script>
var C=window.ZCFG||{},TOK="",ALL=[],F="All";var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function call(o){o.idToken=TOK;return fetch(C.backendUrl,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()})}
function load(){$("msg").textContent="Loading orders…";$("msg").className="";call({action:"adminList"}).then(function(j){if(!j.ok)throw new Error(j.error);ALL=j.orders;$("msg").hidden=true;$("app").hidden=false;$("gbtn").hidden=true;draw()}).catch(function(e){$("msg").hidden=false;$("msg").className="err";$("msg").textContent=String(e.message||e)})}
function draw(){var S=["All","New","Printing","Shipped","Delivered","Cancelled"],paid=ALL.filter(function(o){return o.status==="PAID"}),rev=paid.reduce(function(a,o){return a+Number(o.amount||0)},0);
$("stats").innerHTML='<div class="st"><b>'+ALL.length+'</b><span>All orders</span></div><div class="st"><b>'+paid.length+'</b><span>Paid</span></div><div class="st"><b>₹'+rev.toLocaleString("en-IN")+'</b><span>Paid revenue</span></div><div class="st"><b>'+ALL.filter(function(o){return o.status==="PAID"&&o.fulfil==="New"}).length+'</b><span>To fulfil</span></div>';
$("bar").innerHTML=S.map(function(s){return'<button class="'+(s===F?"on":"")+'" data-s="'+s+'">'+s+'</button>'}).join("");
Array.prototype.forEach.call($("bar").children,function(b){b.onclick=function(){F=b.dataset.s;draw()}});
var rows=ALL.filter(function(o){return F==="All"||o.fulfil===F});
$("list").innerHTML=rows.length?rows.map(function(o){return'<div class="o"><div class="top"><div><b>'+esc(o.product)+'</b> × '+esc(o.qty)+' · ₹'+esc(o.amount)+'</div><div><span class="pill '+(o.status==="PAID"?"paid":"")+'">'+esc(o.status)+'</span> <span class="pill">'+esc(o.fulfil)+'</span></div></div><div class="g"><div>Customer<br><b>'+esc(o.name)+'</b></div><div>Phone<br><b>'+esc(o.phone)+'</b></div><div>Email<br><b>'+esc(o.email)+'</b></div><div>Ship to<br><b>'+esc(o.address)+', '+esc(o.city)+', '+esc(o.state)+' '+esc(o.pin)+'</b></div><div>Order<br><b>'+esc(o.order)+'</b></div><div>Payment<br><b>'+esc(o.payment)+'</b></div><div>Placed<br><b>'+esc(o.time)+'</b></div></div><div class="ed"><select id="s'+o.row+'">'+["New","Printing","Shipped","Delivered","Cancelled"].map(function(s){return'<option'+(s===o.fulfil?" selected":"")+'>'+s+'</option>'}).join("")+'</select><input id="t'+o.row+'" placeholder="Tracking / courier" value="'+esc(o.tracking)+'"><input id="n'+o.row+'" placeholder="Note" value="'+esc(o.note)+'"><button class="btn" onclick="save('+o.row+')">Save</button></div></div>'}).join(""):'<div id="msg">No orders here yet.</div>'}
function save(r){call({action:"adminUpdate",row:r,fulfil:$("s"+r).value,tracking:$("t"+r).value,note:$("n"+r).value}).then(function(j){if(!j.ok)throw new Error(j.error);load()}).catch(function(e){alert(e.message||e)})}
function boot(){if(!C.googleClientId||!C.backendUrl){$("msg").textContent="Checkout backend is not connected yet (config.js is empty).";return}
var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=function(){google.accounts.id.initialize({client_id:C.googleClientId,callback:function(x){TOK=x.credential;load()}});google.accounts.id.renderButton($("gbtn"),{theme:"filled_black",size:"large"})};document.head.appendChild(s)}
boot();
</script></body></html>
