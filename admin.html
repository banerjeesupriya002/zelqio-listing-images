<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | ZELQIO</title><style>:root{--bg:#07070d;--card:#101019;--bd:rgba(255,255,255,.1);--mut:#9a9ab5;--g:linear-gradient(90deg,#00e5ff,#7c5cff,#ff3ec9)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}a{color:#00e5ff}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 22px;background:rgba(7,7,13,.92);border-bottom:1px solid var(--bd)}.logo{font-weight:900;letter-spacing:.28em;text-decoration:none;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{font-size:.65rem;letter-spacing:.2em;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}.sp{flex:1}.who{color:var(--mut);font-size:.82rem}.gb{background:#161622;color:#f4f4fb;border:1px solid var(--bd);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.82rem}.gb:hover{border-color:#7c5cff}.gb.p{background:var(--g);border:0;font-weight:700}.w{max-width:1100px;margin:0 auto;padding:26px 18px 60px}.gate{max-width:420px;margin:12vh auto;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:34px 26px}.gate h1{margin:0 0 6px;font-size:1.5rem}.gate p{color:var(--mut)}.err{color:#ff6b8a;min-height:1.3em;margin-top:12px;font-size:.9rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}.st b{display:block;font-size:1.6rem}.st span{color:var(--mut);font-size:.8rem}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar input{flex:1;min-width:200px;background:#12121c;color:#fff;border:1px solid var(--bd);border-radius:999px;padding:10px 16px}.pill{background:#12121c;color:#cfcfe6;border:1px solid var(--bd);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.8rem}.pill.on{border-color:#7c5cff;background:#1d1740;color:#fff}.o{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;margin-bottom:12px}.oh{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}.oh h3{margin:0;font-size:1rem}.bd{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin:12px 0;font-size:.85rem}.g small{display:block;color:var(--mut);font-size:.72rem}.ed{display:grid;grid-template-columns:150px 1fr 1fr auto;gap:8px}.ed select,.ed input{background:#12121c;color:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0}.empty{text-align:center;color:var(--mut);padding:50px 0}#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#1d1740;border:1px solid #7c5cff;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translateX(-50%)}@media(max-width:720px){.ed{grid-template-columns:1fr}.top{padding:10px 14px}}</style></head><body><header class="top"><a class="logo" href="index.html">ZELQIO</a><span class="tag">ADMIN</span><div class="sp"></div><div id="tools" style="display:none;gap:8px;align-items:center;flex-wrap:wrap"><span class="who" id="who"></span><button class="gb" id="ref">Refresh</button><button class="gb" id="csv">Export CSV</button><button class="gb p" id="out">Sign out</button></div></header><main class="w"><div class="gate" id="gate"><h1>Owner sign in</h1><p>Sign in with the ZELQIO owner Google account to manage orders.</p><div id="gs" style="display:flex;justify-content:center;margin-top:18px"></div><div class="err" id="err"></div></div><div id="dash" style="display:none"><div class="tabs"><button class="pill on" id="tbo">Orders</button><button class="pill" id="tbp">Products</button></div><div id="otab"><div class="stats" id="stats"></div><div class="bar"><input id="q" placeholder="Search by name, order, email, phone, product"><span id="flt" style="display:contents"></span></div><div id="list"></div></div><div id="ptab" style="display:none"></div></div></main><div id="toast"></div><script src="config.js"></script><script src="categories.js"></script><script>var C=window.ZCFG||{},$=function(i){return document.getElementById(i)},T="zat",data=[],flt="All",q="";
var COL={New:"#ffb020",Printing:"#00e5ff",Shipped:"#a58bff",Delivered:"#3dffb0",Cancelled:"#ff6b8a"};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function post(o){return fetch(C.backendUrl,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()})}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2200)}
function gate(m){$("dash").style.display="none";$("gate").style.display="block";$("tools").style.display="none";$("err").textContent=m||""}
function init(){if(!C.googleClientId||!C.backendUrl){gate("Admin is not configured yet.");return}
google.accounts.id.initialize({client_id:C.googleClientId,callback:function(r){sessionStorage.setItem(T,r.credential);load()}});
google.accounts.id.renderButton($("gs"),{theme:"filled_black",size:"large",shape:"pill",text:"signin_with"});
if(sessionStorage.getItem(T))load()}
function load(){$("err").textContent="";post({action:"adminList",idToken:sessionStorage.getItem(T)}).then(function(j){if(!j.ok)throw new Error(j.error||"Could not load orders");data=j.orders||[];$("gate").style.display="none";$("dash").style.display="block";$("tools").style.display="flex";try{var p=JSON.parse(atob(sessionStorage.getItem(T).split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));$("who").textContent=p.email||""}catch(e){}render()}).catch(function(e){sessionStorage.removeItem(T);gate(e.message)})}
function paid(o){return o.status==="PAID"}
function render(){
var all=data.length,pd=data.filter(paid),rev=0;pd.forEach(function(o){rev+=Number(o.amount)||0});
var tf=pd.filter(function(o){return(o.fulfil||"New")==="New"}).length;
$("stats").innerHTML='<div class="st"><b>'+all+'</b><span>All orders</span></div><div class="st"><b>'+pd.length+'</b><span>Paid</span></div><div class="st"><b>&#8377;'+rev.toLocaleString("en-IN")+'</b><span>Paid revenue</span></div><div class="st"><b>'+tf+'</b><span>To fulfil</span></div>';
var fl=["All","New","Printing","Shipped","Delivered","Cancelled"];
$("flt").innerHTML=fl.map(function(f){return '<button class="pill'+(f===flt?" on":"")+'" data-f="'+f+'">'+f+'</button>'}).join("");
var rows=data.filter(function(o){var f=o.fulfil||"New";if(flt!=="All"&&f!==flt)return false;if(q){var h=(o.order+" "+o.name+" "+o.email+" "+o.phone+" "+o.product+" "+o.city).toLowerCase();if(h.indexOf(q)<0)return false}return true});
if(!rows.length){$("list").innerHTML='<div class="empty">No orders match.</div>';return}
$("list").innerHTML=rows.map(function(o){var f=o.fulfil||"New",id=o.row||o.i;var d=new Date(o.time);var ds=isNaN(d)?esc(o.time):d.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
var opts=["New","Printing","Shipped","Delivered","Cancelled"].map(function(s){return '<option'+(s===f?" selected":"")+'>'+s+'</option>'}).join("");
return '<div class="o"><div class="oh"><h3>'+esc(o.product)+' &times; '+esc(o.qty)+' &middot; &#8377;'+esc(o.amount)+'</h3><div><span class="bd" style="background:'+(paid(o)?"#0d3a2b":"#3a2a0d")+';color:'+(paid(o)?"#3dffb0":"#ffb020")+'">'+(paid(o)?"PAID":esc(o.status))+'</span> <span class="bd" style="background:#161622;color:'+(COL[f]||"#fff")+'">'+f+'</span></div></div><div class="g"><div><small>Customer</small>'+esc(o.name)+'</div><div><small>Phone</small>'+esc(o.phone)+'</div><div><small>Email</small>'+esc(o.email)+'</div><div><small>Ship to</small>'+esc(o.address)+', '+esc(o.city)+', '+esc(o.state)+' '+esc(o.pin)+'</div><div><small>Order</small>'+esc(o.order)+'</div><div><small>Payment</small>'+esc(o.payment||"-")+'</div><div><small>Placed</small>'+ds+'</div></div><div class="ed" data-r="'+id+'"><select class="s">'+opts+'</select><input class="t" placeholder="Tracking / courier details" value="'+esc(o.tracking)+'"><input class="n" placeholder="Note (shown to customer)" value="'+esc(o.note)+'"><button class="gb p sv">Save</button></div></div>'}).join("")}
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset&&t.dataset.f){flt=t.dataset.f;render()}
if(t.classList.contains("sv")){var ed=t.parentNode,row=ed.getAttribute("data-r");t.disabled=true;t.textContent="Saving";post({action:"adminUpdate",idToken:sessionStorage.getItem(T),row:row,fulfil:ed.querySelector(".s").value,tracking:ed.querySelector(".t").value,note:ed.querySelector(".n").value}).then(function(j){if(!j.ok)throw new Error(j.error||"Failed");toast("Saved. Customer notified on status change.");load()}).catch(function(x){toast(x.message);t.disabled=false;t.textContent="Save"})}});
$("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();render()});
$("ref").onclick=function(){load()};
$("out").onclick=function(){sessionStorage.removeItem(T);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()};
$("csv").onclick=function(){var h=["order","time","status","fulfil","name","phone","email","address","city","state","pin","product","qty","amount","payment","tracking","note"];var L=[h.join(",")];data.forEach(function(o){L.push(h.map(function(k){return '"'+String(o[k]==null?"":o[k]).replace(/"/g,'""')+'"'}).join(","))});var b=new Blob([L.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zelqio-orders.csv";a.click()};</script><script src="admin-products.js"></script><script src="https://accounts.google.com/gsi/client" async defer onload="init()"></script></body></html>
