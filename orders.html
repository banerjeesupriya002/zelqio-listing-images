<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My orders | ZELQIO</title><style>:root{--bg:#07070d;--card:#101019;--bd:rgba(255,255,255,.1);--mut:#9a9ab5;--g:linear-gradient(90deg,#00e5ff,#7c5cff,#ff3ec9)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}a{color:#00e5ff}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;background:rgba(7,7,13,.92);border-bottom:1px solid var(--bd)}.logo{font-weight:900;letter-spacing:.28em;text-decoration:none;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.sp{flex:1}.who{color:var(--mut);font-size:.82rem}.gb{background:#161622;color:#f4f4fb;border:1px solid var(--bd);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.82rem;text-decoration:none}.gb.p{background:var(--g);border:0;font-weight:700}.w{max-width:820px;margin:0 auto;padding:30px 18px 70px}h1{margin:0 0 4px;font-size:1.8rem}.sub{color:var(--mut);margin:0 0 24px}.gate{max-width:420px;margin:10vh auto;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:34px 26px}.gate p{color:var(--mut)}.err{color:#ff6b8a;min-height:1.3em;margin-top:12px;font-size:.9rem}.o{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:16px}.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.oh h3{margin:0;font-size:1.05rem}.m{color:var(--mut);font-size:.8rem;margin-top:2px}.bd{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;background:#161622;height:fit-content}.tr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 8px}.tr div{text-align:center;font-size:.72rem;color:var(--mut)}.tr i{display:block;height:6px;border-radius:3px;background:#22222f;margin-bottom:7px}.tr .on{color:#fff;font-weight:700}.tr .on i{background:var(--g)}.box{background:#12121c;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-top:10px}.ad{color:var(--mut);font-size:.82rem;margin-top:10px}.empty{text-align:center;color:var(--mut);padding:50px 0}</style></head><body><header class="top"><a class="logo" href="index.html">ZELQIO</a><div class="sp"></div><div id="tools" style="display:none;gap:8px;align-items:center;flex-wrap:wrap"><span class="who" id="who"></span><a class="gb" href="index.html">Shop</a><button class="gb" id="ref">Refresh</button><button class="gb p" id="out">Sign out</button></div></header><main class="w"><div class="gate" id="gate"><h1>My orders</h1><p>Sign in with the Google account you used at checkout to see your orders and delivery updates.</p><div id="gs" style="display:flex;justify-content:center;margin-top:18px"></div><div class="err" id="err"></div></div><div id="list" style="display:none"><h1 id="hi">My orders</h1><p class="sub">Track your ZELQIO orders here. We also email you at every step.</p><div id="os"></div></div></main><script src="config.js"></script><script>var C=window.ZCFG||{},$=function(i){return document.getElementById(i)},T="zct";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function post(o){return fetch(C.backendUrl,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()})}
function gate(m){$("list").style.display="none";$("gate").style.display="block";$("tools").style.display="none";$("err").textContent=m||""}
function init(){if(!C.googleClientId||!C.backendUrl){gate("Accounts open soon.");return}
google.accounts.id.initialize({client_id:C.googleClientId,callback:function(r){sessionStorage.setItem(T,r.credential);load()}});
google.accounts.id.renderButton($("gs"),{theme:"filled_black",size:"large",shape:"pill",text:"signin_with"});
if(sessionStorage.getItem(T))load()}
function load(){$("err").textContent="";post({action:"myOrders",idToken:sessionStorage.getItem(T)}).then(function(j){if(!j.ok)throw new Error(j.error||"Could not load your orders");$("gate").style.display="none";$("list").style.display="block";$("tools").style.display="flex";try{var p=JSON.parse(atob(sessionStorage.getItem(T).split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));$("who").textContent=p.email||"";$("hi").textContent="Hi "+(p.given_name||p.name||"there")}catch(e){}render(j.orders||[])}).catch(function(e){sessionStorage.removeItem(T);gate("Please sign in again. "+e.message)})}
function render(a){
if(!a.length){$("os").innerHTML='<div class="empty">No orders yet.<br><br><a class="gb p" href="index.html">Start shopping</a></div>';return}
var N=["Confirmed","Printing","Shipped","Delivered"],IX={New:0,Printing:1,Shipped:2,Delivered:3};
$("os").innerHTML=a.map(function(o){var s=o.status==="Cancelled"?-1:(IX[o.status]||0);var d=new Date(o.time);var ds=isNaN(d)?"":d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
var tr=s<0?'<div class="box" style="color:#ff6b8a">This order was cancelled.</div>':'<div class="tr">'+N.map(function(n,i){return '<div class="'+(i<=s?"on":"")+'"><i></i>'+n+'</div>'}).join("")+'</div>';
var info=(o.tracking||o.note)?'<div class="box">'+(o.tracking?'<b>Tracking:</b> '+esc(o.tracking):'')+(o.note?'<br>'+esc(o.note):'')+'</div>':'';
return '<div class="o"><div class="oh"><div><h3>'+esc(o.product)+' &times; '+esc(o.qty)+'</h3><div class="m">Order '+esc(o.order)+' &middot; '+ds+' &middot; &#8377;'+esc(o.amount)+'</div></div><span class="bd">'+esc(o.status==="New"?"Confirmed":o.status)+'</span></div>'+tr+info+'<div class="ad">Ship to: '+esc(o.address)+'</div><div class="ad">Questions about this order? <a href="contact.html">Contact us</a></div></div>'}).join("")}
$("ref").onclick=function(){load()};
$("out").onclick=function(){sessionStorage.removeItem(T);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()};</script><script src="https://accounts.google.com/gsi/client" async defer onload="init()"></script></body></html>
