<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Publish | ZELQIO</title><link rel="icon" href="Gemini_Generated_Image_5d1f65d1f65d1f65.png"><script src="config.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>:root{--bg:#07070d;--card:#10101a;--bd:#262638;--mut:#9a9ab8;--ac:#3dffb0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif}header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd)}header img{width:34px;height:34px;border-radius:8px}header b{letter-spacing:.2em}main{max-width:620px;margin:0 auto;padding:22px 16px}.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px}h2{margin:0 0 6px;font-size:1.15rem}p.m{color:var(--mut);font-size:.88rem;margin:0 0 14px}button{background:var(--ac);color:#04140d;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.95rem;cursor:pointer}button.g{background:#1a1a2a;color:#fff;border:1px solid var(--bd)}button:disabled{opacity:.5}textarea,input{width:100%;background:#12121c;color:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:1rem}textarea{height:90px;font-family:monospace;font-size:.8rem}.r{display:flex;gap:12px}.r>div{flex:1}label{display:block;color:var(--mut);font-size:.78rem;margin:12px 0 5px}.pv{display:flex;gap:14px;align-items:center}.pv img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:#12121c}.sp{font-size:1.6rem;font-weight:800;color:var(--ac)}.sp s{color:var(--mut);font-size:1rem;font-weight:400;margin-left:8px}#msg{min-height:1.4em;margin-top:12px;font-size:.92rem}.hide{display:none}</style></head><body>
<header><img src="Gemini_Generated_Image_5d1f65d1f65d1f65.png" alt=""><b>ZELQIO</b><span style="color:var(--mut);font-size:.8rem">PUBLISH</span></header>
<main>
<div class="c" id="si"><h2>Sign in</h2><p class="m">Owner Google account only.</p><div id="gb"></div><div id="sm" style="color:#ff8aa0;margin-top:10px"></div></div>
<div id="app" class="hide">
<div class="c"><h2>1. Get product from Studio</h2><p class="m">In ZELQIO Studio tap <b>Copy for website</b>, come back here and tap the button.</p><button id="pc">Paste from clipboard</button> <button class="g" id="po">Sign out</button><label>Or paste it here</label><textarea id="pt" placeholder="product JSON"></textarea></div>
<div class="c hide" id="pr"><h2>2. Set price and publish</h2><div class="pv"><img id="im" alt=""><div><div id="nm" style="font-weight:700"></div><div id="ct" style="color:var(--mut);font-size:.85rem"></div></div></div>
<div class="r"><div><label>Price (MRP)</label><input id="mrp" type="number" min="1"></div><div><label>Discount %</label><input id="dis" type="number" min="0" max="90"></div></div>
<div style="margin:16px 0"><span class="sp" id="sel"></span><s id="old"></s></div>
<button id="pub">Publish to zelqio.in</button><div id="msg"></div></div>
</div></main>
<script>
var C=window.ZCFG||{},T="zpub",P=null;function $(i){return document.getElementById(i)}
function post(o){return fetch(C.backendUrl,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()})}
function show(){var ok=!!sessionStorage.getItem(T);$("si").classList.toggle("hide",ok);$("app").classList.toggle("hide",!ok)}
function init(){if(!window.google||!google.accounts){return setTimeout(init,300)}google.accounts.id.initialize({client_id:C.googleClientId,callback:function(r){sessionStorage.setItem(T,r.credential);show()}});google.accounts.id.renderButton($("gb"),{theme:"filled_black",size:"large",shape:"pill"})}
init();show();
$("po").onclick=function(){sessionStorage.removeItem(T);location.reload()};
function calc(){var m=Math.round(Number($("mrp").value)||0),d=Math.min(90,Math.max(0,Number($("dis").value)||0));var s=Math.round(m*(1-d/100));$("sel").textContent="Rs "+s;$("old").textContent=d?"Rs "+m+"  ("+d+"% off)":"";return {m:m,d:d,s:s}}
$("mrp").oninput=calc;$("dis").oninput=calc;
function load(txt){var p;try{p=JSON.parse(txt)}catch(e){$("msg").textContent="";alert("That is not valid product JSON.");return}if(p.products&&p.products.length)p=p.products[0];P=p;var m=Number(p.mrp||p.price)||0;var d=30;if(p.offerPrice&&m)d=Math.round((1-Number(p.offerPrice)/m)*100);$("mrp").value=m;$("dis").value=d;$("nm").textContent=p.name||p.id;$("ct").textContent=p.category||"";var im=p.image||"";if(im&&im.indexOf("http")!==0)im="/"+im;$("im").src=im;$("pr").classList.remove("hide");$("msg").textContent="";calc()}
$("pc").onclick=function(){navigator.clipboard.readText().then(function(t){$("pt").value=t;load(t)}).catch(function(){alert("Clipboard blocked. Paste into the box below instead.")})};
$("pt").oninput=function(){if(this.value.trim())load(this.value)};
$("pub").onclick=function(){if(!P)return;var v=calc();if(!v.m||v.s<1){$("msg").textContent="Enter a valid price.";return}var q={};for(var k in P)q[k]=P[k];q.price=v.m;q.mrp=v.m;q.offerPrice=v.s;var b=$("pub");b.disabled=true;$("msg").textContent="Publishing...";post({action:"publishProduct",idToken:sessionStorage.getItem(T),product:q}).then(function(j){if(!j.ok)throw new Error(j.error||"Failed");$("msg").innerHTML="<span style='color:#3dffb0'>"+(j.updated?"Updated":"Published")+" at Rs "+v.s+". Live on zelqio.in in about 1 minute.</span>"}).catch(function(x){$("msg").textContent="Error: "+x.message}).then(function(){b.disabled=false})};
</script></body></html>
